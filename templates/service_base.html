<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Frikanalen data services{% endblock title %}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
      }
      header, main, footer {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 54rem;
        padding: 1rem;
      }
      header {
        border-bottom: 1px solid currentColor;
      }
      header a {
        color: inherit;
        font-size: 1.25rem;
        font-weight: 700;
        text-decoration: none;
      }
      footer {
        border-top: 1px solid currentColor;
        font-size: 0.875rem;
      }
      code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="https://frikanalen.no/">Frikanalen</a>
    </header>
    <main>
      {% block heading-title %}{% endblock heading-title %}
      {% block content %}{% endblock content %}
    </main>
    <footer>
      <a href="{% url 'api-root' %}">REST API</a> ·
      <a href="{% url 'api-tvanytime-home' %}">TV-Anytime</a> ·
      <a href="{% url 'xmltv-home' %}">XMLTV</a> ·
      <a href="https://github.com/Frikanalen">{% trans "Source code" %}</a>
    </footer>
  </body>
</html>
