django:
  image:
    repository: ghcr.io/frikanalen/django-api
    tag: latest
    pullPolicy: IfNotPresent
  secretName: django-secret
  # Two, on different nodes where possible, so draining a node never takes
  # the API down; see templates/pdb.yaml.
  replicas: 2

events:
  # Each process listens to the database once and serves any number of
  # streams, so one would carry the load; the second is there so a node
  # drain doesn't cut every playout subscriber off at once.
  replicas: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nginx:
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent

database:
  # Secret holding DATABASE_URL (and the Postgres passwords it is built
  # from). Created outside the chart -- by infra's roles/django_db_secret --
  # and pointing at CloudNativePG's pgcluster since 2026-11-10; the chart no
  # longer runs a database of its own.
  secret: django-postgres-passwords

# Fernet keys that encrypt pulled live sources' addresses (FK_PULL_URL_KEYS,
# comma-separated, newest first), one set per environment, from OpenBao via
# an ExternalSecret. Unset, members cannot make a source a pulled one.
pullUrlKeys:
  secret: ""

# SMTP login (EMAIL_HOST_USER, EMAIL_HOST_PASSWORD), from OpenBao via an
# ExternalSecret. The rest of the mail settings are plain env below; Django
# only sends for real once env sets EMAIL_BACKEND to the SMTP backend.
email:
  secret: ""

memcached:
  image:
    repository: memcached
    tag: 1.6-alpine
    pullPolicy: IfNotPresent

env:
  DJANGO_SETTINGS_MODULE: fkweb.settings.production
  # The memcached this chart deploys. Shared by every worker and pod, so a
  # schedule change can clear the page cache everywhere at once.
  CACHE_URL: pymemcache://memcached:11211
  ALLOWED_HOSTS: beta.frikanalen.tv
  CSRF_TRUSTED_ORIGINS: https://beta.frikanalen.tv
  # Handed to the frontend as a video's uploadUrl. Always set it: the settings
  # default to the production URL, so leaving it out makes a non-production
  # deployment advertise production's endpoint. Points at tusd, which the
  # ingest chart serves under /upload on this same host.
  FK_UPLOAD_URL: https://beta.frikanalen.tv/upload
  # Same reasoning as FK_UPLOAD_URL above. Points at the media-server ingress
  # for this environment's own archive.
  FK_MEDIA_URLPREFIX: https://beta.frikanalen.tv/media/

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  hostname: beta.frikanalen.tv

monitoring:
  # Off by default: the ServiceMonitor CRD only exists where
  # kube-prometheus-stack is installed, so enabling this unconditionally
  # would break `helm install` on a cluster without it.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
