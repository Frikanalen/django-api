django:
  image:
    repository: ghcr.io/frikanalen/django-api
    tag: latest
    pullPolicy: IfNotPresent
  secretName: django-secret

nginx:
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent

database:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  kubegresName: django-postgres
  databaseName: fkweb
  configMapName: django-postgres-conf
  user: fkweb
  secret: django-postgres-passwords
  port: "5432"
  size: 200Mi
  replicas: "1"

memcached:
  image:
    repository: memcached
    tag: 1.6-alpine
    pullPolicy: IfNotPresent

env:
  DJANGO_SETTINGS_MODULE: fkweb.settings.production
  ALLOWED_HOSTS: beta.frikanalen.no
  CSRF_TRUSTED_ORIGINS: https://beta.frikanalen.no
  # Handed to the frontend as a video's uploadUrl. Always set it: the settings
  # default to the production URL, so leaving it out makes a non-production
  # deployment advertise production's endpoint. Points at tusd, which the
  # ingest chart serves under /upload on this same host.
  FK_UPLOAD_URL: https://beta.frikanalen.no/upload
  # Same reasoning as FK_UPLOAD_URL above. Points at the media-server ingress
  # for this environment's own archive.
  FK_MEDIA_URLPREFIX: https://beta.frikanalen.no/media/

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  hostname: beta.frikanalen.no

monitoring:
  # Off by default: the ServiceMonitor CRD only exists where
  # kube-prometheus-stack is installed, so enabling this unconditionally
  # would break `helm install` on a cluster without it.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
