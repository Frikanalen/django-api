name: Django API service

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs on a feature branch are pointless; on main they may be
# mid-release or mid-push, so let those finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run --settings=fkweb.settings.test

      - name: Run tests with coverage
        run: uv run pytest --cov

      # Reporting only. Coverage is deliberately not a merge gate: a change that
      # lowers the percentage is still allowed to land.
      - name: Publish coverage summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo '### Coverage'
            echo ''
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TODO: add a `lint` job running `ruff check` and `ruff format --check`.
  # Blocked on a one-off cleanup pass: as of this commit `ruff check` reports
  # 235 errors (134 auto-fixable; mostly RUF012 mutable class defaults and I001
  # import ordering) and `ruff format --check` wants to reformat 5 files. The
  # vendored stubs in typings/ account for ~21 of those and should go in
  # `[tool.ruff] exclude` rather than being fixed. Adding this job before that
  # work lands would just make main permanently red.

  build:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    # Pull requests get the test job as their gate. They must not push images:
    # the tags would be meaningless, and GITHUB_TOKEN on a fork PR has no
    # packages:write anyway.
    if: github.event_name != 'pull_request'

    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write # Needed to push to ghcr.io

    steps:
      - name: Release PR or GitHub Release

        uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          release-type: python

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/frikanalen/django-api
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=${{ steps.release.outputs.tag_name }},enable=${{ github.ref == 'refs/heads/main' && steps.release.outputs.release_created == 'true' }}
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
