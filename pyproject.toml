[project]
name = "fkweb"
version = "0.2.0"
description = "Frikanalen's Django-based backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dj-database-url==2.3.0",
    "django==5.2",
    "django-cors-headers==4.7.0",
    "django-durationfield==0.5.5",
    "django-environ>=0.12.0",
    "django-filter==25.1",
    "django-model-utils==5.0.0",
    "django-phonenumber-field[phonenumbers]==8.0.0",
    "djangorestframework==3.16.0",
    "djangorestframework-camel-case>=1.4.2",
    "drf-spectacular==0.28.0",
    "drf-standardized-errors[openapi]>=0.15.0",
    "gunicorn==23.0.0",
    "markdown==3.7",
    "mypy>=1.11",
    "psycopg2-binary>=2.9.10",
    "pymemcache>=4.0.0",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.3",
]

[tool.ruff]
line-length = 100
exclude = [
    # Vendored third-party type stubs. Copies of upstream sources, not our code:
    # linting or reformatting them only makes the next refresh harder to diff.
    "typings",
    # Migrations are archival. They record what was applied to the database and
    # are never edited after the fact, so the linter has no business in them.
    "*/migrations",
]
# Without this, `ruff check fk/migrations` (or a pre-commit hook passing
# filenames) would lint the excluded paths anyway.
force-exclude = true

[tool.ruff.lint]
ignore = [
    # Django and DRF are declarative: `fields`, `permission_classes` and
    # `list_display` are all mutable class attributes by design, and the
    # frameworks read them off the class. Every occurrence in this codebase is
    # one of those, so the rule only buys us `ClassVar` noise on ~25 lines.
    "RUF012",
]

[tool.pytest]
minversion = "9.1"
DJANGO_SETTINGS_MODULE = "fkweb.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py", "*_tests.py"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
# The jukebox filler drives an unbounded while-loop, so a mistake in its
# pool bookkeeping hangs the suite rather than failing it.  Fail instead.
timeout = "60"

[tool.coverage.run]
branch = true
source = ["agenda", "api", "fk", "fkweb", "news"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "djangorestframework-stubs~=3.17.1",
    "mypy>=1.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.1",
]
